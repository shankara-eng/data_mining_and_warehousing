services:
  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna
      POSTGRES_DB: annapurna
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annapurna -d annapurna"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: annapurna-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: